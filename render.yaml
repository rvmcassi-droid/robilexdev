# Blueprint do Hacking N Robilex (plano grátis do Render)
databases:
  - name: robilex-db
    databaseName: robilex
    plan: free
    region: oregon

services:
  - type: web
    name: robilexdev
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: robilex-db
          property: connectionString
